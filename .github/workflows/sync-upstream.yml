name: sync-upstream

# Pulls the shared files (AGENTS.md, CLAUDE.md and .claude/) from the public base
# repository and opens or updates a PR on the `sync-upstream` branch when they
# differ. Memory files and .claude/settings.local.json are never touched, and files
# that exist only in this repo (such as other skills) are left alone.
# This workflow file itself is not synced: the Actions token cannot modify
# workflows, so copy it by hand when it changes.

on:
  schedule:
    - cron: '17 4 * * *' # daily, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream

jobs:
  sync:
    # In the base repository this file is only a template for user repos.
    if: github.repository != 'a-resh/psychologist-skill-base'
    runs-on: ubuntu-latest
    env:
      BASE_REPO: a-resh/psychologist-skill-base
      SKILL_DIR: .claude/skills/psychologist
    steps:
      - uses: actions/checkout@v7

      - name: Copy shared files from the base repository
        run: |
          base="$RUNNER_TEMP/base"
          git clone --depth 1 "https://github.com/$BASE_REPO" "$base"
          # Never take memory or local settings from the base
          rm -rf "$base/$SKILL_DIR/memory" "$base/.claude/settings.local.json"
          cp "$base/AGENTS.md" "$base/CLAUDE.md" .
          # The psychologist skill mirrors the base (except memory/);
          # the rest of .claude/ only gets files added or updated
          mkdir -p "$SKILL_DIR"
          find "$SKILL_DIR" -mindepth 1 -maxdepth 1 ! -name memory -exec rm -rf {} +
          cp -R "$base/.claude/." .claude/
          echo "BASE_SHA=$(git -C "$base" rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - uses: peter-evans/create-pull-request@v8
        with:
          branch: sync-upstream
          delete-branch: true
          add-paths: |
            AGENTS.md
            CLAUDE.md
            .claude
          commit-message: Sync shared files from psychologist-skill-base@${{ env.BASE_SHA }}
          title: Sync from psychologist-skill-base
          body: |
            Updates `AGENTS.md`, `CLAUDE.md` and `.claude/` from
            ${{ env.BASE_REPO }}@${{ env.BASE_SHA }}.
            Memory files are not touched. Merge to apply the update.
